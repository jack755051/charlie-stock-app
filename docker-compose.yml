version: '3.9'

services:
  # PostgreSQL 資料庫
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: stock_app_db
      POSTGRES_USER: stock_user
      POSTGRES_PASSWORD: stock_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock_user -d stock_app_db"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Django 後端
  backend:
    build: 
      context: ./stock-backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DATABASE_URL=postgresql://stock_user:stock_password@db:5432/stock_app_db
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend
    volumes:
      - ./stock-backend:/app
      - /app/__pycache__
      - /app/.pytest_cache
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      python manage.py runserver 0.0.0.0:8000
      "
    restart: unless-stopped

  # Nuxt.js 前端
  frontend:
    build: 
      context: ./stock-frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8000/api
      - NODE_ENV=development
    volumes:
      - ./stock-frontend:/app
      - /app/node_modules
      - /app/.nuxt
    depends_on:
      - backend
    command: sh -c "
      npm install &&
      npm run dev
      "
    restart: unless-stopped

  # Redis (用於快取和會話管理)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
